    // --- NUMBER TO WORDS INDIAN RUPEES ---
    function numberToWordsIndian(amount) {
      if (isNaN(amount) || amount === null || amount === undefined) return "Zero Rupees Only";
      const totalAmount = Math.round(amount * 100) / 100;
      let rupees = Math.floor(totalAmount);
      let paise = Math.round((totalAmount - rupees) * 100);

      if (rupees === 0 && paise === 0) return "Zero Rupees Only";

      const singleDigits = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
      const teens = ["Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
      const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

      function convertThreeDigit(num) {
        let str = "";
        if (num >= 100) { str += singleDigits[Math.floor(num / 100)] + " Hundred "; num %= 100; }
        if (num >= 20) { str += tens[Math.floor(num / 10)] + " "; num %= 10; }
        else if (num >= 10) { str += teens[num - 10] + " "; num = 0; }
        if (num > 0) { str += singleDigits[num] + " "; }
        return str;
      }

      let words = "";
      const crore = Math.floor(rupees / 10000000); rupees %= 10000000;
      const lakh = Math.floor(rupees / 100000); rupees %= 100000;
      const thousand = Math.floor(rupees / 1000); rupees %= 1000;

      if (crore > 0) words += convertThreeDigit(crore) + "Crore ";
      if (lakh > 0) words += convertThreeDigit(lakh) + "Lakh ";
      if (thousand > 0) words += convertThreeDigit(thousand) + "Thousand ";
      if (rupees > 0) words += convertThreeDigit(rupees);

      words = words.trim();
      if (words.length > 0) words += " Rupees";
      if (paise > 0) {
        const paiseText = convertThreeDigit(paise).trim();
        words += (words.length > 0 ? " and " : "") + paiseText + " Paise";
      }
      return words ? words + " Only" : "Zero Rupees Only";
    }

    // --- INVOICE PP PROFIT TOTAL CALCULATOR ---
    function getInvoicePpTotal(inv) {
      if (!inv) return 0;
      if (inv.summary && typeof inv.summary.ppTotal === 'number') {
        return inv.summary.ppTotal;
      }
      if (inv.rows && Array.isArray(inv.rows)) {
        return inv.rows.reduce((sum, r) => {
          const qty = parseFloat(r.qty) || 0;
          const baseRate = parseFloat(r.rate) || 0;
          const ppPct = parseFloat(r.ppPercent) || 0;
          return sum + (qty * (baseRate * (ppPct / 100)));
        }, 0);
      }
      return 0;
    }

    // --- ROW TOTAL CALCULATOR ---
    function calculateRowTotals(row) {
      const qty = parseFloat(row.qty) || 0;
      const baseRate = parseFloat(row.rate) || 0;
      const ppPct = parseFloat(row.ppPercent) || 0;
      const discPct = parseFloat(row.discountPercent) || 0;
      const gstPct = parseFloat(row.gstPercent) || 0;

      let lineTotal, taxable, totalGst, cgst, sgst, gross, discAmount, sellingRate;

      if (row.manualTotal !== undefined && row.manualTotal !== null && row.manualTotal !== "" && !isNaN(parseFloat(row.manualTotal))) {
        lineTotal = parseFloat(row.manualTotal);
        taxable = lineTotal / (1 + (gstPct / 100));
        totalGst = lineTotal - taxable;
        cgst = totalGst / 2;
        sgst = totalGst / 2;
        const discFactor = (1 - (discPct / 100)) > 0 ? (1 - (discPct / 100)) : 1;
        gross = taxable / discFactor;
        discAmount = gross - taxable;
        sellingRate = (qty > 0) ? (gross / qty) : gross;
      } else {
        sellingRate = baseRate * (1 + (ppPct / 100));
        gross = qty * sellingRate;
        discAmount = gross * (discPct / 100);
        taxable = gross - discAmount;
        totalGst = taxable * (gstPct / 100);
        cgst = totalGst / 2;
        sgst = totalGst / 2;
        lineTotal = taxable + totalGst;
      }

      // Line item PP Profit total (Qty * Base Rate * PP%)
      const linePpProfit = qty * (baseRate * (ppPct / 100));

      return { qty, baseRate, ppPct, sellingRate, gross, discAmount, taxable, totalGst, cgst, sgst, lineTotal, linePpProfit };
    }

      rWS.forEach((row, index) => {

        ]);

      excelData.push([]);
      excelData.push(["", "", "", "", "", "", "", "", "", "", "Subtotal:", sum.taxableSubtotal || 0]);
      excelData.push(["", "", "", "", "", "", "", "", "", "", "CGST Total:", sum.cgstTotal || 0]);
      excelData.push(["", "", "", "", "", "", "", "", "", "", "SGST Total:", sum.sgstTotal || 0]);
      if ((sum.igstTotal || 0) > 0) {

      if ((sum.miscCharges || 0) > 0) {

      }
      excelData.push(["", "", "", "", "", "", "", "", "", "", "Round Off:", sum.roundOff || 0]);
      excelData.push(["", "", "", "", "", "", "", "", "", "", "NET PAYABLE (₹):", sum.grandTotal || 0]);
      excelData.push([]);
      excelData.push(["Amount in Words:", numberToWordsIndian(sum.grandTotal || 0)]);

      const worksheet = XLSX.utils.aoa_to_sheet(excelData);
      worksheet['!cols'] = [

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Sudama_Hardware");
      XLSX.writeFile(workbook, `Sudama_Hardware_Invoice_${invoiceNumber.replace(/\//g, '-')}.xlsx`);
    }

    
    // --- SEQUENTIAL INVOICE NUMBER HELPERS ---
        function getTodayDate() {
      return new Date().toISOString().split('T')[0];
    }

    function generateQuotationNumber(quotationsList = []) {
      const yearStr = "2026-27";
      const prefix = `QT/${yearStr}/`;
      const list = quotationsList && quotationsList.length > 0 ? quotationsList : [];
      const numbers = list.map(q => {
        const m = (q.quotationNumber || "").match(/(\d+)$/);
        return m ? parseInt(m[1], 10) : 0;
      });
      const nextNum = (numbers.length > 0 ? Math.max(...numbers) : 0) + 1;
      return `${prefix}${String(nextNum).padStart(4, '0')}`;
    }

    function generateInvoiceNumber(seq) {
      return formatInvoiceNumber(seq);
    }

    function extractInvoiceSeq(invStr) {
      if (!invStr) return 0;
      const match = invStr.match(/(\d+)$/);
      return match ? parseInt(match[1], 10) : 0;
    }

    function formatInvoiceNumber(seq) {
      const padded = seq.toString().padStart(4, '0');
      return `SH/2026-27/${padded}`;
    }

    // --- MAIN APP COMPONENT ---
    function App() {

      // Safe LocalStorage Setter with Quota Exhaustion Fallback for Large Attachments
      const safeSetLocalStorage = (key, data) => {
        try {
          localStorage.setItem(key, typeof data === 'string' ? data : JSON.stringify(data));

      // Helper to generate Blob URL for PDF & Image Preview without Data URL security blocks
      const getBillBlobUrl = (billFile) => {
        if (!billFile) return null;
        if (billFile.url) return billFile.url;
        if (billFile.path && !billFile.data) return '/' + billFile.path;
        if (typeof billFile.data === 'string' && (billFile.data.startsWith('/') || billFile.data.startsWith('blob:'))) return billFile.data;
        if (typeof billFile.data === 'string' && billFile.data.startsWith('data:')) {
          try {
            const parts = billFile.data.split(';base64,');
            const mimeType = parts.length > 1 ? parts[0].replace('data:', '') : (billFile.type || 'application/pdf');
            const base64Content = parts.length > 1 ? parts[1] : parts[0];
            const byteCharacters = atob(base64Content);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
              byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: mimeType });
            return URL.createObjectURL(blob);
          } catch (err) {
            console.error("Error creating Blob URL for bill preview:", err);
            return billFile.data;
          }
        }
        return null;
      };

        if (inputVal === "" || inputVal === null) {
          updated[idx] = { ...r, manualTotal: "" };
          setRows(updated);
          return;
        }

        const newTotal = parseFloat(inputVal);
        if (isNaN(newTotal) || newTotal < 0) {
          updated[idx] = { ...r, manualTotal: inputVal };
          setRows(updated);
          return;
        }

        const qty = parseFloat(r.qty) > 0 ? parseFloat(r.qty) : 1;
        const gstPct = parseFloat(r.gstPercent) || 0;
        const ppPct = parseFloat(r.ppPercent) || 0;
        const discPct = parseFloat(r.discountPercent) || 0;

        // Reverse Math: Taxable = Total / (1 + GST/100)
        const targetTaxable = newTotal / (1 + (gstPct / 100));

        // Gross = Taxable / (1 - Disc/100)
        const discFactor = (1 - (discPct / 100)) > 0 ? (1 - (discPct / 100)) : 1;
        const targetGross = targetTaxable / discFactor;

        // Selling Rate = Gross / Qty
        const targetSellingRate = targetGross / qty;

        // Base Rate = Selling Rate / (1 + PP/100)
        const targetBaseRate = targetSellingRate / (1 + (ppPct / 100));

        const roundedBaseRate = Math.round(targetBaseRate * 10000) / 10000;

        updated[idx] = {

        const cName = (customerObj.name || "").trim().toLowerCase();
        const cPhone = (customerObj.phone || "").trim().toLowerCase();

        // 1. Sales (Debits)
        const salesEntries = [];
        savedInvoices.forEach(inv => {
          const invCustName = (inv.customer && inv.customer.name ? inv.customer.name : "").trim().toLowerCase();
          const invCustPhone = (inv.customer && inv.customer.phone ? inv.customer.phone : "").trim().toLowerCase();

          const isMatch = (cName && invCustName === cName) || (cPhone && invCustPhone && invCustPhone === cPhone);

              id: inv.id || `inv-${inv.invoiceNumber}`,

              type: 'Sale',
              accountName: `Bill No. ${inv.invoiceNumber || 'N/A'}`,
              debit: (inv.summary && inv.summary.grandTotal) || 0,
              credit: 0
            });
          }
        });

        // 2. Payments Received (Credits)
        const paymentEntries = [];
        customerLedger.forEach(entry => {
          const entryCustName = (entry.customerName || "").trim().toLowerCase();
          const entryCustPhone = (entry.customerPhone || "").trim().toLowerCase();
          const entryCustId = entry.customerId;

          const isMatch = (customerObj.id && entryCustId === customerObj.id) ||
                          (cName && entryCustName === cName) ||
                          (cPhone && entryCustPhone && entryCustPhone === cPhone);

          if (isMatch) {

            paymentEntries.push({
              id: entry.id,
              date: entry.date || getTodayDate(),
              type: 'Received',
              accountName: `Recd by ${entry.receiveType || 'Payment'}${refStr}`,
              debit: 0,
              credit: entry.creditAmount || 0,

        });

        const allTxns = [...salesEntries, ...paymentEntries].sort((a, b) => a.date.localeCompare(b.date));

        // 4. Calculate Opening Balance (before startDateStr)
        let openingBalance = 0;
        const inRangeTxns = [];

        allTxns.forEach(t => {
          if (startDateStr && t.date < startDateStr) {
            openingBalance += (t.debit - t.credit);
          } else if (!endDateStr || t.date <= endDateStr) {
            inRangeTxns.push(t);
          }
        });

        // 5. Compute running balances for items in range
        let runningBal = openingBalance;
        let totalDebits = 0;
        let totalCredits = 0;

        const rowsWithBal = inRangeTxns.map(t => {
          runningBal += (t.debit - t.credit);
          totalDebits += t.debit;
          totalCredits += t.credit;
          return {
            ...t,
            currentBal: runningBal
          };
        });

        const closingBalance = openingBalance + totalDebits - totalCredits;

        return {
          items: rowsWithBal,
          openingBalance,
          totalDebits,
          totalCredits,
          closingBalance
        };
      };

                            <select value={row.gstPercent} onChange={e => updateRowField(idx, 'gstPercent', parseFloat(e.target.value))} className="w-full bg-transparent text-right font-mono text-slate-300 text-xs p-1 outline-none">

                            </select>

                          <td className="p-1 text-center">
                            <div className="flex items-center justify-center gap-1">

              const matchPhone = ((inv.customer && inv.customer.phone) || "").toLowerCase().includes(q);
              const matchGstin = ((inv.customer && inv.customer.gstin) || "").toLowerCase().includes(q);
              const matchPayment = (inv.paymentMode || "").toLowerCase().includes(q);
              const matchItems = inv.rows && inv.rows.some(r => (r.itemName || "").toLowerCase().includes(q) || (r.hsn || "").includes(q));

              return matchInvNo || matchCust || matchPhone || matchGstin || matchPayment || matchItems;
            });

            const filteredQuotations = savedQuotations.filter(qt => {
              const qtDate = qt.quotationDate || "";
              let matchesDate = true;
              if (historyCustomDate) {
                matchesDate = (qtDate === historyCustomDate);
              } else if (historyDateFilter === 'today') {
                matchesDate = (qtDate === todayStr);
              } else if (historyDateFilter === 'yesterday') {
                matchesDate = (qtDate === yesterdayStr);
              } else if (historyDateFilter === 'this_week') {
                matchesDate = (qtDate >= weekStartStr && qtDate <= todayStr);
              } else if (historyDateFilter === 'this_month') {
                matchesDate = qtDate.startsWith(currentMonthStr);
              }

              if (!matchesDate) return false;

              const q = historySearch.trim().toLowerCase();
              if (!q) return true;

              const matchQtNo = (qt.quotationNumber || "").toLowerCase().includes(q);
              const matchCust = ((qt.customer && qt.customer.name) || "").toLowerCase().includes(q);
              const matchPhone = ((qt.customer && qt.customer.phone) || "").toLowerCase().includes(q);
              const matchPayment = (qt.paymentMode || "").toLowerCase().includes(q);
              const matchItems = qt.rows && qt.rows.some(r => (r.itemName || "").toLowerCase().includes(q) || (r.hsn || "").includes(q));

              return matchQtNo || matchCust || matchPhone || matchPayment || matchItems;
            });

            const totalFilteredAmount = filteredInvoices.reduce((sum, inv) => sum + ((inv.summary && inv.summary.grandTotal) || 0), 0);
            const totalFilteredPpProfit = filteredInvoices.reduce((sum, inv) => sum + getInvoicePpTotal(inv), 0);

            return (

                  {/* Modal Header */}

                      <h3 className="font-bold text-white font-heading text-base flex items-center gap-2">
                        <span>📜</span> Sudama Hardware Sales & Quotation Register

                      <div className="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
                        <button

                            historyTab === 'invoices' ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'

                          🧾 Tax Invoices ({savedInvoices.length})
                        </button>
                        <button
                          onClick={() => setHistoryTab('quotations')}

                            historyTab === 'quotations' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          📝 Quotations ({savedQuotations.length})
                        </button>
                      </div>
                    </div>

                    <button onClick={() => setIsHistoryOpen(false)} className="text-slate-400 hover:text-white text-base">✕</button>
                  </div>

                  {/* Search Bar, Date Filters & Summary Stats Toolbar */}

                    {/* Row 1: Text Search & Live Revenue/Profit Stats */}

                          placeholder="Search invoice no, customer name, phone, item..."

                          onChange={e => setHistorySearch(e.target.value)}

                        />

                          <button onClick={() => setHistorySearch("")} className="absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs">✕</button>

                      </div>

                      <div className="flex items-center gap-4 text-xs font-mono self-end sm:self-center">
                        {historyTab === 'quotations' ? (
                          <>
                            <span className="text-slate-400">Total: <strong className="text-cyan-400 font-bold">{filteredQuotations.length}</strong> Quotations</span>
                            <span className="text-slate-400">Est. Value: <strong className="text-cyan-300 font-bold">₹{filteredQuotations.reduce((sum, q) => sum + ((q.summary && q.summary.grandTotal) || 0), 0).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</strong></span>
                          </>
                        ) : (
                          <>
                            <span className="text-slate-400">Total: <strong className="text-amber-400 font-bold">{filteredInvoices.length}</strong> Bills</span>
                            <span className="text-slate-400">Revenue: <strong className="text-emerald-400 font-bold">₹{totalFilteredAmount.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</strong></span>
                            <span className="text-slate-400">Profit (PP): <strong className="text-emerald-300 font-extrabold">₹{totalFilteredPpProfit.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</strong></span>
                          </>
                        )}
                      </div>
                    </div>

                    {/* Row 2: Date Quick-Filter Pills & Interactive Date Picker */}
                    <div className="flex flex-wrap items-center gap-2 text-xs pt-2 border-t border-slate-800/60">
                      <span className="text-slate-400 font-semibold text-[11px] flex items-center gap-1 mr-1">📅 Date Filter:</span>
                      
                      {[
                        { id: 'all', label: 'All Time' },
                        { id: 'today', label: 'Today' },
                        { id: 'yesterday', label: 'Yesterday' },
                        { id: 'this_week', label: 'This Week' },
                        { id: 'this_month', label: 'This Month' }
                      ].map(btn => (
                        <button
                          key={btn.id}
                          onClick={() => {
                            setHistoryDateFilter(btn.id);
                            setHistoryCustomDate("");
                          }}
                          className={`px-2.5 py-1 rounded-lg text-xs font-medium transition ${
                            historyDateFilter === btn.id && !historyCustomDate
                              ? 'bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/20'
                              : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-700'
                          }`}
                        >
                          {btn.label}
                        </button>
                      ))}

                      {/* Custom Specific Date Picker */}
                      <div className="flex items-center gap-1.5 ml-auto">
                        <span className="text-[11px] text-slate-400 font-medium">Specific Date:</span>
                        <input
                          type="date"
                          value={historyCustomDate}
                          onChange={e => {
                            setHistoryCustomDate(e.target.value);
                            if (e.target.value) setHistoryDateFilter('custom');
                            else setHistoryDateFilter('all');
                          }}

                      </div>

                    {historyTab === 'invoices' ? (

                                  <div className="text-[10px] text-emerald-400 font-semibold mt-0.5">
                                    PP Profit: ₹{getInvoicePpTotal(inv).toLocaleString('en-IN', { minimumFractionDigits: 2 })}
                                  </div>
                                </td>
                                <td className="p-2.5 text-center">
                                  <div className="flex items-center justify-center gap-3">
                                    <button
                                      onClick={() => {
                                        setDocType('bill');
                                        if (inv.customer) setCustomer(inv.customer);
                                        if (inv.rows) setRows(inv.rows);
                                        if (inv.invoiceNumber) setInvoiceNumber(inv.invoiceNumber);
                                        if (inv.invoiceDate) setInvoiceDate(inv.invoiceDate);
                                        if (inv.dueDate) setDueDate(inv.dueDate);
                                        if (inv.paymentMode) setPaymentMode(inv.paymentMode);
                                        setIsHistoryOpen(false);

                                      📋 Load

                                      title="Export to Excel (.xlsx)"
                                    >
                                      📥 Excel
                                    </button>
                                    <button
                                      onClick={() => {
                                         setDocType('bill');
                                         if (inv.customer) setCustomer(inv.customer);
                                         if (inv.rows) setRows(inv.rows);
                                         if (inv.invoiceNumber) setInvoiceNumber(inv.invoiceNumber);
                                         if (inv.invoiceDate) setInvoiceDate(inv.invoiceDate);
                                         if (inv.dueDate) setDueDate(inv.dueDate);
                                         if (inv.paymentMode) setPaymentMode(inv.paymentMode);
                                         if (inv.miscCharges) setMiscCharges(inv.miscCharges);
                                         setPrintReturnTab('invoices');
                                         setIsHistoryOpen(false);
                                         setIsPrintOpen(true);

                                      title="Print Invoice / Save PDF"
                                    >
                                      🖨️ Print
                                    </button>
                                    <button
                                      onClick={() => {
                                        if (confirm(`Delete invoice ${inv.invoiceNumber || ''} from history?`)) {
                                          setSavedInvoices(savedInvoices.filter(i => i.id !== inv.id));
                                        }
                                      }}
                                      className="bg-rose-950/60 hover:bg-rose-900 text-rose-300 px-1.5 py-1 rounded text-[10px] font-semibold border border-rose-800/80"
                                      title="Delete Invoice Record"
                                    >
                                      🗑️
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      )
                    ) : (
                      /* QUOTATIONS REGISTER TABLE */
                      filteredQuotations.length === 0 ? (
                        <div className="text-center py-12 text-slate-500 space-y-1">
                          <div>No saved quotations found for selected date & search filter.</div>
                          <div className="text-[11px] text-slate-600">Click "+ New Quotation" in the top bar to create and save quotations.</div>
                        </div>
                      ) : (
                        <div className="w-full overflow-x-hidden">
                          <table className="w-full text-left border-collapse text-[11px] sm:text-xs">
                            <thead>
                              <tr className="bg-slate-950 text-slate-400 border-b border-slate-800 font-bold text-[11px] whitespace-nowrap">
                                <th className="py-2.5 px-2 text-left">Quotation No</th>
                                <th className="py-2.5 px-2 text-left">Date</th>
                                <th className="py-2.5 px-2 text-left">Customer Name & Phone</th>
                                <th className="py-2.5 px-2 text-center">Status</th>
                                <th className="py-2.5 px-2 text-center">Converted to Invoice</th>
                                <th className="py-2.5 px-2 text-right">Est. Total (₹)</th>
                                <th className="py-2.5 px-2 text-center">Actions</th>

                            <tbody className="divide-y divide-slate-800">
                              {filteredQuotations.map(q => {
                                const isConverted = q.isArchived || q.status === 'Converted to Bill' || Boolean(q.convertedToInvoiceNumber);
                                return (
                                  <tr key={q.id} className={`transition ${isConverted ? 'bg-emerald-950/20' : 'hover:bg-slate-800/40'}`}>

                                    </td>
                                    <td className="py-2.5 px-2 text-center whitespace-nowrap">
                                      {isConverted ? (
                                        <span className="bg-emerald-950 text-emerald-300 border border-emerald-700/80 px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap inline-flex items-center gap-1">

                                        </span>

                                          📝 Active
                                        </span>
                                      )}
                                    </td>
                                    <td className="py-2.5 px-2 text-center whitespace-nowrap font-mono text-xs">
                                      {isConverted ? (
                                         <button
                                           onClick={() => {
                                             const invNum = q.convertedToInvoiceNumber;
                                             const matchingInvoice = savedInvoices.find(i => i.invoiceNumber === invNum);
                                             if (matchingInvoice) {
                                               setDocType('bill');
                                               if (matchingInvoice.customer) setCustomer(matchingInvoice.customer);
                                               if (matchingInvoice.rows) setRows(matchingInvoice.rows);
                                               if (matchingInvoice.invoiceNumber) setInvoiceNumber(matchingInvoice.invoiceNumber);
                                               if (matchingInvoice.invoiceDate) setInvoiceDate(matchingInvoice.invoiceDate);
                                               if (matchingInvoice.dueDate) setDueDate(matchingInvoice.dueDate);
                                               if (matchingInvoice.paymentMode) setPaymentMode(matchingInvoice.paymentMode);
                                               if (matchingInvoice.miscCharges) setMiscCharges(matchingInvoice.miscCharges);
                                               setPrintReturnTab('quotations');
                                               setIsHistoryOpen(false);
                                               setIsPrintOpen(true);
                                             } else {
                                               alert(`Tax Invoice #${invNum || ''} was not found in Sales Register.`);
                                             }
                                           }}
                                           className="font-bold text-amber-300 hover:text-amber-100 bg-amber-950/90 hover:bg-amber-900 border border-amber-700/80 px-2 py-0.5 rounded text-[10px] whitespace-nowrap inline-flex items-center gap-1 cursor-pointer transition shadow-sm hover:scale-105"

                                             if (q.paymentMode) setPaymentMode(q.paymentMode);

                                        </button>

                                  </tr>

                                <div className="text-xs text-slate-400">{comparisonList.length} Suppliers Tracked</div>

                      value={quickPurchaseForm.vendorId}
                      onChange={e => setQuickPurchaseForm({...quickPurchaseForm, vendorId: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-2 text-slate-100 outline-none"
                    >
                      <option value="">-- Select Registered Vendor --</option>
                      {vendors.map(v => (
                        <option key={v.id} value={v.id}>{v.name} ({v.phone || 'No phone'})</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Purchase Rate (Cost Price ₹) *</label>
                      <input
                        type="number"
                        step="any"
                        required
                        placeholder="e.g. 310"
                        value={quickPurchaseForm.purchaseRate}
                        onChange={e => setQuickPurchaseForm({...quickPurchaseForm, purchaseRate: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-2 text-slate-100 font-mono outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Purchased Qty ({quickPurchaseTarget.unit}) *</label>
                      <input
                        type="number"
                        step="any"
                        required
                        min="1"
                        value={quickPurchaseForm.purchasedQty}
                        onChange={e => setQuickPurchaseForm({...quickPurchaseForm, purchasedQty: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-2 text-slate-100 font-mono outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Bill / Invoice Number</label>
                      <input
                        type="text"
                        placeholder="e.g. SUP-INV-881"
                        value={quickPurchaseForm.billNo}
                        onChange={e => setQuickPurchaseForm({...quickPurchaseForm, billNo: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-2 text-slate-100 font-mono uppercase outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Purchase Date</label>
                      <input
                        type="date"
                        value={quickPurchaseForm.purchaseDate}
                        onChange={e => setQuickPurchaseForm({...quickPurchaseForm, purchaseDate: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-2 text-slate-100 outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Remarks / Trade Notes</label>
                    <input
                      type="text"
                      placeholder="e.g. Bulk lot discount rate from regional distributor"
                      value={quickPurchaseForm.remarks}
                      onChange={e => setQuickPurchaseForm({...quickPurchaseForm, remarks: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-2 text-slate-100 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Attach Bill Document (PDF / Image)</label>
                    <input
                      type="file"
                      accept="image/*,application/pdf"
                      onChange={(e) => {
                        if (e.target.files && e.target.files[0]) {
                          const file = e.target.files[0];
                          const reader = new FileReader();
                          reader.onload = (evt) => {
                            setQuickPurchaseForm(prev => ({
                              ...prev,
                              billFile: {
                                name: file.name,
                                type: file.type,
                                size: file.size,
                                data: evt.target.result
                              }
                            }));
                          };
                          reader.readAsDataURL(file);
                        }
                      }}
                      className="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-lg p-1.5 text-slate-300 text-xs file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-emerald-500/20 file:text-emerald-300 hover:file:bg-emerald-500/30 outline-none"
                    />
                    {quickPurchaseForm.billFile && (
                      <div className="text-[10px] text-emerald-400 mt-1 flex items-center gap-1 font-mono">
                        <span>✓ Attached:</span> <span className="truncate">{quickPurchaseForm.billFile.name}</span>
                      </div>
                    )}
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-2.5 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setIsQuickPurchaseOpen(false)}
                      className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-600/20 flex items-center gap-1.5 transition"
                    >
                      <span>📦 Save Purchase Record</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}


          {/* VENDOR BILL DOCUMENT PREVIEW MODAL */}
          {viewingBillFile && (() => {
            const blobUrl = getBillBlobUrl(viewingBillFile);
            const isPdf = (viewingBillFile.type && viewingBillFile.type.includes('pdf')) || (viewingBillFile.name && viewingBillFile.name.toLowerCase().endsWith('.pdf'));

            return (
              <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 modal-overlay-bg bg-slate-950/90 backdrop-blur-md">
                <div className="bg-slate-900 border border-cyan-500/40 rounded-2xl w-full max-w-5xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                  {/* Modal Header */}
                  <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                    <div className="flex items-center gap-2.5">
                      <span className="text-xl">{isPdf ? '📄' : '🖼️'}</span>
                      <div>
                        <h3 className="font-bold text-white font-heading text-sm flex items-center gap-2">
                          Vendor Bill Document Preview
                        </h3>
                        <p className="text-[11px] text-cyan-400 font-mono">{viewingBillFile.name}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      {blobUrl && (
                        <a
                          href={blobUrl}
                          download={viewingBillFile.name || "Vendor_Bill_Document"}
                          className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3.5 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition shadow"
                        >
                          <span>📥 Download File</span>
                        </a>
                      )}
                      <button onClick={() => setViewingBillFile(null)} className="text-slate-400 hover:text-white text-base px-2">✕</button>
                    </div>
                  </div>

                  {/* Document Preview Box */}
                  <div className="p-4 flex-1 overflow-y-auto flex items-center justify-center bg-slate-950/90 min-h-[60vh]">
                    {isPdf ? (
                      blobUrl ? (
                        <object data={blobUrl} type="application/pdf" className="w-full h-[68vh] rounded-xl border border-slate-800">
                          <embed src={blobUrl} type="application/pdf" className="w-full h-[68vh] rounded-xl border border-slate-800" />
                          <div className="text-center p-6 text-slate-400 space-y-3">
                            <p>PDF preview is restricted by browser security settings.</p>
                            <a href={blobUrl} download={viewingBillFile.name} className="inline-block bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-xs">
                              📥 Download PDF to View ({viewingBillFile.name})
                            </a>
                          </div>
                        </object>
                      ) : (
                        <div className="text-center p-6 text-slate-400 space-y-2">
                          <p className="text-amber-400 font-bold">📄 PDF file stored safely on disk server.</p>
                          <p className="text-xs text-slate-500">Please click Download to view full document.</p>
                        </div>
                      )
                    ) : (
                      <img src={blobUrl || viewingBillFile.data} alt="Vendor Bill Preview" className="max-h-[68vh] max-w-full object-contain rounded-xl shadow-2xl border border-slate-800" />
                    )}
                  </div>

                  <div className="p-3 border-t border-slate-800 bg-slate-950 flex justify-end">
                    <button onClick={() => setViewingBillFile(null)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-4 py-1.5 rounded-lg text-xs transition">
                      Close Preview
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
